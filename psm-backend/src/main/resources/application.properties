# =====================================================================
#  Projects Manager (PSM) - SmartSoft Solutions
#  Chaque valeur ${VARIABLE:defaut} peut être surchargée par une variable
#  d'environnement (pratique sur le VPS). En local, modifiez les valeurs
#  par défaut marquées "A MODIFIER".
# =====================================================================
spring.application.name=psm
server.port=8082

# ---------- MySQL (la base psm_db est créée automatiquement) ----------
spring.datasource.url=jdbc:mysql://localhost:3307/amsdbrest2026?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true

spring.datasource.username=root
# A MODIFIER : le mot de passe root que vous utilisez dans MySQL Workbench
spring.datasource.password=




spring.web.resources.static-locations[0]=file:src/main/resources/static/
spring.web.resources.static-locations[1]=classpath:/static/



# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Email (Gmail SMTP) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# A MODIFIER : l'adresse Gmail qui ENVOIE les emails
spring.mail.username=${MAIL_USERNAME:votre.adresse@gmail.com}
# A MODIFIER : mot de passe d'application Gmail (16 lettres, sans espaces) - voir README
spring.mail.password=${MAIL_PASSWORD:xxxxxxxxxxxxxxxx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Application ----------
# A MODIFIER : l'adresse qui REÇOIT la notification à chaque nouvelle inscription
psm.admin.email=${ADMIN_NOTIFY_EMAIL:votre.adresse@gmail.com}
# URL du frontend (utilisée dans les liens des emails)
psm.frontend-url=${FRONTEND_URL:http://localhost:4200}
# Origines autorisées par CORS (Angular en développement)
psm.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ---------- JWT ----------
# Clé secrète Base64 (>= 256 bits). Changez-la en production (openssl rand -base64 64).
psm.jwt.secret=${JWT_SECRET:fuAzblRi+H7qcDhn1FR2pgY1pIQQhkPC1Ca79d+ARmz9KHR7JoJ5NXUpeBdz0WnwJZbe5vXDLP44KfoNNkgsRw==}
# Durée de validité du token : 24 h (en millisecondes)
psm.jwt.expiration=86400000
