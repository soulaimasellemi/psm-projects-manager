# =====================================================================
#  Profil "render" (activé par le Dockerfile) : toute la configuration
#  vient des variables d'environnement définies dans render.yaml / Render.
# =====================================================================

# ---------- Base PostgreSQL Render ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# ---------- URL publique (Render fournit RENDER_EXTERNAL_URL) ----------
psm.frontend-url=${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
psm.cors.allowed-origins=${CORS_ORIGINS:${RENDER_EXTERNAL_URL:http://localhost:8080}}

# ---------- Fichiers joints (disque éphémère sur le plan gratuit) ----------
psm.upload.dir=${UPLOAD_DIR:/tmp/uploads}

psm.demo-data=${DEMO_DATA:false}
